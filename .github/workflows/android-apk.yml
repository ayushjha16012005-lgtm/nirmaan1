name: Build and Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" || true

      - name: Build Android Debug APK
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle.log

      - name: Save error log on failure
        if: failure()
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log
          cp ../gradle.log error.log || cp gradle.log error.log || true
          tail -n 200 error.log > error.txt || true
          git add error.log error.txt
          git commit -m "chore: save build error log" || true
          git push origin build-log -f || true

      - name: Prepare APK binary
        run: |
          find android/ -name "*.apk"
          APK_FILE=$(find android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/ -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "No APK found, check gradle output"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B build-log
            cp gradle.log error.log || true
            git add error.log
            git commit -m "chore: save build error log" || true
            git push origin build-log -f || true
            exit 1
          fi
          cp "$APK_FILE" Nirmaan.apk
          ls -lh Nirmaan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nirmaan-APK
          path: Nirmaan.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nirmaan Android v1.0.${{ github.run_number }}"
          files: Nirmaan.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
